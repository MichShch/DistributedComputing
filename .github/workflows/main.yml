# This starter workflow is for a CMake project running on a single platform. There is a different starter workflow if you need cross-platform coverage.
# See: https://github.com/actions/starter-workflows/blob/main/ci/cmake-multi-platform.yml
name: CMake on a single platform

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  # Customize the CMake build type here (Release, Debug, RelWithDebInfo, etc.)
  BUILD_TYPE: Release

jobs:
  build-cmake:
    # The CMake configure and build commands are platform agnostic and should work equally well on Windows or Mac.
    # You can convert this to a matrix build if you need cross-platform coverage.
    # See: https://docs.github.com/en/free-pro-team@latest/actions/learn-github-actions/managing-complex-workflows#using-a-build-matrix
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Configure CMake
      # Configure CMake in a 'build' subdirectory. `CMAKE_BUILD_TYPE` is only required if you are using a single-configuration generator such as make.
      # See https://cmake.org/cmake/help/latest/variable/CMAKE_BUILD_TYPE.html?highlight=cmake_build_type
      run: cmake -B ${{github.workspace}}/build -DCMAKE_BUILD_TYPE=${{env.BUILD_TYPE}}

    - name: Build
      # Build your program with the given configuration
      run: cmake --build ${{github.workspace}}/build --config ${{env.BUILD_TYPE}}

  build-master:
    runs-on: ubuntu=latest
    needs: build-cmake
    steps:
    - uses: actions/checkout@v4
      
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Extract SHA
      id: meta
      run: echo "SHORT_SHA=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
      
    - name: Build and push amd64-arch production image
      uses: docker/build-push-action@v6
      with:
        context: ".docker/altera_tools"
        platforms: linux/amd64
        target: master
        tags: |
          dc_master:latest
          dc_master:${{ steps.meta.outputs.SHORT_SHA }}
        cache-from: type=gha
        cache-to: type=gha,mode=max
        push: false
        outputs: type=docker,dest=${{ runner.temp }}/dc_master.tar

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: dc_master
        path: ${{ runner.temp }}/dc_master.tar

  build-worker:
    runs-on: ubuntu=latest
    needs: build-cmake
    steps:
    - uses: actions/checkout@v4
      
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Extract SHA
      id: meta
      run: echo "SHORT_SHA=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
      
    - name: Build and push amd64-arch production image
      uses: docker/build-push-action@v6
      with:
        context: ".docker/altera_tools"
        platforms: linux/amd64
        target: worker
        tags: |
          dc_worker:latest
          dc_worker:${{ steps.meta.outputs.SHORT_SHA }}
        cache-from: type=gha
        cache-to: type=gha,mode=max
        push: false
        outputs: type=docker,dest=${{ runner.temp }}/dc_worker.tar

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: dc_worker
        path: ${{ runner.temp }}/dc_worker.tar

  build-cli:
    runs-on: ubuntu=latest
    needs: build-cmake
    steps:
    - uses: actions/checkout@v4
      
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Extract SHA
      id: meta
      run: echo "SHORT_SHA=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
      
    - name: Build and push amd64-arch production image
      uses: docker/build-push-action@v6
      with:
        context: ".docker/altera_tools"
        platforms: linux/amd64
        target: cli
        tags: |
          dc_master:latest
          dc_master:${{ steps.meta.outputs.SHORT_SHA }}
        cache-from: type=gha
        cache-to: type=gha,mode=max
        push: false
        outputs: type=docker,dest=${{ runner.temp }}/dc_master.tar

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: dc_master
        path: ${{ runner.temp }}/dc_master.tar
